## values-dev.yaml — Tilt + kind overrides
## Images are built and injected by Tilt; do not use registry tags here.

backendApi:
  image:
    repository: kubechan/backend-api
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  storage:
    # macOS host paths are not visible inside a kind node. The default kind
    # StorageClass keeps the development database across pod restarts.
    hostPath: ""
    pvc:
      size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

clusterWatcher:
  image:
    repository: kubechan/cluster-watcher
    tag: latest
    pullPolicy: Never
  debounceWindowSecs: 5
  pendingTooLongThresholdSecs: 60
  unavailableThresholdSecs: 60
  backendApiUrl: "http://kubechan-backend-api:8080"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

diagnosticsWorker:
  image:
    repository: kubechan/diagnostics-worker
    tag: latest
    pullPolicy: Never
  logTailLines: 100
  prevLogTailLines: 50
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

llmGateway:
  image:
    repository: kubechan/llm-gateway
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

frontendUi:
  image:
    repository: kubechan/frontend-ui
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: kubechan.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
