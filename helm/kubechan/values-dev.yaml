## values-dev.yaml — Docker Desktop Kubernetes overrides
## Usage: helm install kubechan ./helm/kubechan -f helm/kubechan/values-dev.yaml

backendApi:
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  storage:
    pvc:
      size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

clusterWatcher:
  debounceWindowSecs: 5
  pendingTooLongThresholdSecs: 60
  unavailableThresholdSecs: 60
  # URL of the backend-api service inside the cluster for live threshold polling.
  backendApiUrl: "http://kubechan-backend-api:8080"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

diagnosticsWorker:
  logTailLines: 100
  prevLogTailLines: 50
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

llmGateway:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

frontendUi:
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: kubechan.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
