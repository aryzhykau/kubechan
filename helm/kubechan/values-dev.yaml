## values-dev.yaml — Docker Desktop Kubernetes overrides
## Usage: helm install kubechan ./helm/kubechan -f helm/kubechan/values-dev.yaml

backendApi:
  image:
    repository: kubechan/backend-api
    tag: latest
    pullPolicy: Never
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  storage:
    hostPath: /Users/andrei.ryzhykau/kubechan-data
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

clusterWatcher:
  image:
    repository: kubechan/cluster-watcher
    tag: latest
    pullPolicy: Never
  debounceWindowSecs: 5
  pendingTooLongThresholdSecs: 60
  unavailableThresholdSecs: 60
  backendApiUrl: "http://kubechan-backend-api:8080"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

diagnosticsWorker:
  image:
    repository: kubechan/diagnostics-worker
    tag: latest
    pullPolicy: Never
  logTailLines: 100
  prevLogTailLines: 50
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

llmGateway:
  image:
    repository: kubechan/llm-gateway
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

frontendUi:
  image:
    repository: kubechan/frontend-ui
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"
    className: nginx
    hosts:
      - host: kubechan.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
