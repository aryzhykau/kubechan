{{- if .Values.backendApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubechan.fullname" . }}-backend-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
spec:
  type: {{ .Values.backendApi.service.type }}
  selector:
    {{- include "kubechan.selectorLabels" . | nindent 4 }}
    kubechan.io/component: backend-api
  ports:
    - name: http
      port: {{ .Values.backendApi.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.backendApi.service.type "NodePort") .Values.backendApi.service.nodePort }}
      nodePort: {{ .Values.backendApi.service.nodePort }}
      {{- end }}
{{- end }}
