apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubechan.fullname" . }}-backend-api
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
rules:
  # Read cluster workloads for context (used by informer cache)
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "nodes", "events", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # ProblemCase — read only (cluster-watcher owns writes)
  - apiGroups: ["kubechan.io"]
    resources: ["problemcases"]
    verbs: ["get", "list", "watch"]
  # Incident — backend-api creates manual incidents and patches status
  - apiGroups: ["kubechan.io"]
    resources: ["incidents"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["kubechan.io"]
    resources: ["incidents/status"]
    verbs: ["get", "update", "patch"]
  # DiagnosticRun — backend-api creates them (POST /analyze) and patches status
  - apiGroups: ["kubechan.io"]
    resources: ["diagnosticruns"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["kubechan.io"]
    resources: ["diagnosticruns/status"]
    verbs: ["get", "update", "patch"]
  # KubeChanState — backend-api owns the singleton (mood persistence)
  - apiGroups: ["kubechan.io"]
    resources: ["kubechanstates"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["kubechan.io"]
    resources: ["kubechanstates/status"]
    verbs: ["get", "update", "patch"]
  # ExclusionRule — backend-api manages full lifecycle
  - apiGroups: ["kubechan.io"]
    resources: ["kubechanexclusionrules"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["kubechan.io"]
    resources: ["kubechanexclusionrules/status"]
    verbs: ["get", "patch"]
  # Dynamic CRD resource picker — allow read-only list/get across any installed CRD
  # so the UI can enumerate arbitrary resources (KEDA, Argo, etc.) as incident evidence.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubechan.fullname" . }}-backend-api
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubechan.fullname" . }}-backend-api
subjects:
  - kind: ServiceAccount
    name: {{ include "kubechan.fullname" . }}-backend-api
    namespace: {{ .Release.Namespace }}
