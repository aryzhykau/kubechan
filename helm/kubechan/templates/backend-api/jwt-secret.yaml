{{- /*
  JWT signing secret for backend-api.
  On first install: generates a cryptographically-random 64-char hex secret.
  On upgrades: looks up the existing Secret and reuses its value, so the key
  is never rotated by `helm upgrade`.
*/}}
{{- $secretName := .Values.auth.jwtSecretName | default "kubechan-jwt-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $secret := "" }}
{{- if $existing }}
  {{- $secret = index $existing.data "secret" | b64dec }}
{{- else }}
  {{- $secret = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret: {{ $secret | b64enc | quote }}
