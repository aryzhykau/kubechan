{{- /*
  Namespaced Role granting backend-api the minimal permissions needed to
  read and create the admin-credentials Secret in the install namespace.
  A Role (not ClusterRole) is used because the Secret is namespace-scoped.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubechan.fullname" . }}-backend-api-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
rules:
  # get is restricted to the specific secret name (resourceNames works for read verbs)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - {{ .Values.auth.adminSecretName | default "kubechan-admin-credentials" | quote }}
  # create cannot be restricted by resourceNames in Kubernetes RBAC
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubechan.fullname" . }}-backend-api-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: backend-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubechan.fullname" . }}-backend-api-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kubechan.fullname" . }}-backend-api
    namespace: {{ .Release.Namespace }}
