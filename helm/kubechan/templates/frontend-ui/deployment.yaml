{{- if .Values.frontendUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubechan.fullname" . }}-frontend-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: frontend-ui
spec:
  replicas: {{ .Values.frontendUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubechan.selectorLabels" . | nindent 6 }}
      kubechan.io/component: frontend-ui
  template:
    metadata:
      labels:
        {{- include "kubechan.selectorLabels" . | nindent 8 }}
        kubechan.io/component: frontend-ui
    spec:
      serviceAccountName: {{ include "kubechan.fullname" . }}-frontend-ui
      {{- include "kubechan.nodeSelector" .Values.frontendUi.nodeSelector | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-ui
          image: "{{ .Values.frontendUi.image.repository }}:{{ .Values.frontendUi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontendUi.image.pullPolicy }}
          env:
            - name: BACKEND_API_URL
              value: {{ .Values.frontendUi.backendApiUrl | default (printf "http://%s-backend-api.%s.svc.cluster.local:8080" (include "kubechan.fullname" .) .Release.Namespace) | quote }}
            - name: KUBE_DNS_IP
              value: {{ .Values.frontendUi.kubeDnsIP | default "10.96.0.10" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.frontendUi.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontendUi.resources | nindent 12 }}
{{- end }}
