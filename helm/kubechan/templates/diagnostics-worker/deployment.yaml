{{- if .Values.diagnosticsWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubechan.fullname" . }}-diagnostics-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: diagnostics-worker
spec:
  replicas: {{ .Values.diagnosticsWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubechan.selectorLabels" . | nindent 6 }}
      kubechan.io/component: diagnostics-worker
  template:
    metadata:
      labels:
        {{- include "kubechan.selectorLabels" . | nindent 8 }}
        kubechan.io/component: diagnostics-worker
    spec:
      serviceAccountName: {{ include "kubechan.fullname" . }}-diagnostics-worker
      {{- include "kubechan.nodeSelector" .Values.diagnosticsWorker.nodeSelector | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnostics-worker
          image: "{{ .Values.diagnosticsWorker.image.repository }}:{{ .Values.diagnosticsWorker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.diagnosticsWorker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BACKEND_API_URL
              value: "http://{{ include "kubechan.fullname" . }}-backend-api:{{ .Values.backendApi.service.port }}"
            - name: LOG_TAIL_LINES
              value: {{ .Values.diagnosticsWorker.logTailLines | quote }}
            - name: PREV_LOG_TAIL_LINES
              value: {{ .Values.diagnosticsWorker.prevLogTailLines | quote }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.diagnosticsWorker.resources | nindent 12 }}
{{- end }}
