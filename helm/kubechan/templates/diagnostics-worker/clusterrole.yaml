apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubechan.fullname" . }}-diagnostics-worker
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: diagnostics-worker
rules:
  # DiagnosticRun — watch pending, patch state + status
  - apiGroups: ["kubechan.io"]
    resources: ["diagnosticruns"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["kubechan.io"]
    resources: ["diagnosticruns/status"]
    verbs: ["get", "update", "patch"]
  # Incident + ProblemCase — read to build evidence context
  - apiGroups: ["kubechan.io"]
    resources: ["incidents", "problemcases"]
    verbs: ["get", "list", "watch"]
  # Pod log subresource (not covered by wildcard)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read everything — allows dynamic CRD evidence collection (KEDA, etc.)
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubechan.fullname" . }}-diagnostics-worker
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: diagnostics-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubechan.fullname" . }}-diagnostics-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "kubechan.fullname" . }}-diagnostics-worker
    namespace: {{ .Release.Namespace }}
