{{- if .Values.llmGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubechan.fullname" . }}-llm-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: llm-gateway
spec:
  replicas: {{ .Values.llmGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubechan.selectorLabels" . | nindent 6 }}
      kubechan.io/component: llm-gateway
  template:
    metadata:
      labels:
        {{- include "kubechan.selectorLabels" . | nindent 8 }}
        kubechan.io/component: llm-gateway
    spec:
      serviceAccountName: {{ include "kubechan.fullname" . }}-llm-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-gateway
          image: "{{ .Values.llmGateway.image.repository }}:{{ .Values.llmGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.llmGateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BEDROCK_REGION
              value: {{ .Values.llmGateway.bedrock.region | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.llmGateway.bedrock.modelId | quote }}
            - name: THINKING_BUDGET
              value: {{ .Values.llmGateway.bedrock.thinkingBudget | quote }}
            - name: EVIDENCE_TOKEN_BUDGET
              value: {{ .Values.llmGateway.bedrock.evidenceTokenBudget | quote }}
            - name: BACKEND_API_URL
              value: "http://{{ include "kubechan.fullname" . }}-backend-api:{{ .Values.backendApi.service.port }}"
            {{- if .Values.llmGateway.credentials.secretName }}
            - name: AWS_BEARER_TOKEN_BEDROCK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmGateway.credentials.secretName | quote }}
                  key: AWS_BEARER_TOKEN_BEDROCK
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.llmGateway.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
{{- end }}
