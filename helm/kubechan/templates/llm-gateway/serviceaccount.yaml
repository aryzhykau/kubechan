apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubechan.fullname" . }}-llm-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechan.labels" . | nindent 4 }}
    kubechan.io/component: llm-gateway
  {{- if .Values.llmGateway.irsa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.llmGateway.irsa.roleArn | quote }}
  {{- end }}
