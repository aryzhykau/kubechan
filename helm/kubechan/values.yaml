## KubeChan Helm values
## All fields are documented. Override via --set or -f values-override.yaml.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# cluster-watcher — detects cluster problems and manages ProblemCase CRDs
# ---------------------------------------------------------------------------
clusterWatcher:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/aryzhykau/kubechan-cluster-watcher
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # Seconds to wait after observing a symptom before creating a ProblemCase.
  # Reduces noise from transient states.
  debounceWindowSecs: 30

  # Seconds a Pod must remain Pending before triggering PendingTooLong detector.
  pendingTooLongThresholdSecs: 300

  # Seconds a Deployment must have unavailable replicas before triggering DeploymentUnavailable detector.
  unavailableThresholdSecs: 300

  # Kubernetes namespace this watcher manages (defaults to the release namespace).
  controlNamespace: ""

  # URL of the backend-api service for live threshold polling (leave empty to use env-var values only).
  backendApiUrl: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# diagnostics-worker — collects evidence for ProblemCases
# ---------------------------------------------------------------------------
diagnosticsWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/aryzhykau/kubechan-diagnostics-worker
    tag: ""
    pullPolicy: IfNotPresent

  # Max lines of current container logs to collect per container.
  logTailLines: 500

  # Max lines of previous (crashed) container logs to collect per container.
  prevLogTailLines: 200

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# backend-api — REST API, WebSocket hub, SQLite store
# ---------------------------------------------------------------------------
backendApi:
  enabled: true
  replicaCount: 1  # Must remain 1 — SQLite single-writer constraint
  image:
    repository: ghcr.io/aryzhykau/kubechan-backend-api
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    # Set to a specific port number when type is NodePort (optional).
    nodePort: null

  storage:
    # Set to a local path (dev only) to skip PVC and use a host directory instead.
    hostPath: ""
    pvc:
      # Size of the PVC for SQLite data. Increase for large clusters or long retention.
      size: 5Gi
      # StorageClass name. Empty string uses the cluster default.
      storageClass: ""
      accessMode: ReadWriteOnce

  retention:
    # Days to retain evidence payloads in SQLite.
    evidenceDays: 7
    # Days to retain analysis results in SQLite.
    analysisResultsDays: 30

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# llm-gateway — Bedrock prompt building and analysis
# ---------------------------------------------------------------------------
llmGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/aryzhykau/kubechan-llm-gateway
    tag: ""
    pullPolicy: IfNotPresent

  service:
    port: 8000

  # On EKS, set roleArn to attach an IAM role via IRSA instead of per-user credentials.
  # Leave empty (or omit) on non-EKS clusters (Docker Desktop, GKE, etc.).
  irsa:
    roleArn: ""

  # Server-side prompt truncation limit (tokens). Increase for very large clusters.
  # Provider credentials (region, modelId, thinkingBudget, etc.) are configured
  # per-user in the UI under Settings → LLM Provider.
  evidenceTokenBudget: 120000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---------------------------------------------------------------------------
# frontend-ui — React web interface
# ---------------------------------------------------------------------------
frontendUi:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/aryzhykau/kubechan-frontend-ui
    tag: ""
    pullPolicy: IfNotPresent

  # URL of the backend-api service as seen by nginx inside the cluster.
  # Must be a FQDN when kubeDnsIP resolver is used (nginx bypasses search domain with set $var proxy_pass).
  # Defaults to http://<fullname>-backend-api.<namespace>.svc.cluster.local:8080 if not set.
  backendApiUrl: ""

  # kube-dns ClusterIP. Used by nginx resolver to re-resolve upstreams dynamically.
  # Default 10.96.0.10 works for kubeadm/Docker Desktop. Override for other distros.
  kubeDnsIP: "10.96.0.10"

  service:
    type: ClusterIP
    port: 8080
    # Set to a specific port number when type is NodePort (optional).
    nodePort: null

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: kubechan.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# Auth — user authentication and admin bootstrap
# ---------------------------------------------------------------------------
auth:
  # Name of the K8s Secret that holds (or will hold) the admin password.
  # Secret key: "password". If the Secret does not exist on first startup,
  # backend-api generates a random password and creates the Secret.
  adminSecretName: kubechan-admin-credentials

  # Name of the K8s Secret that holds the JWT signing key.
  # Secret key: "secret". Must be at least 32 bytes.
  # Create manually: kubectl create secret generic kubechan-jwt-secret \
  #   -n kubechan --from-literal=secret=$(openssl rand -base64 48)
  jwtSecretName: kubechan-jwt-secret

  # JWT token lifetime in hours.
  jwtTtlHours: 24


