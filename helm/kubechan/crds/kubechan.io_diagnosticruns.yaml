---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: diagnosticruns.kubechan.io
spec:
  group: kubechan.io
  names:
    kind: DiagnosticRun
    listKind: DiagnosticRunList
    plural: diagnosticruns
    singular: diagnosticrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.problemCaseRef
      name: Problem Case
      type: string
    - jsonPath: .spec.requestedAt
      name: Requested
      type: date
    - jsonPath: .status.collectedAt
      name: Collected
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DiagnosticRun is the Schema for the diagnosticruns API.
          It represents a single evidence collection run triggered for a ProblemCase.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiagnosticRunSpec defines the desired state of DiagnosticRun.
            properties:
              incidentRef:
                description: |-
                  IncidentRef is the name of the Incident this diagnostic run was triggered for.
                  Either IncidentRef or ProblemCaseRef must be set.
                type: string
              problemCaseRef:
                description: |-
                  ProblemCaseRef is the name of the ProblemCase this diagnostic run belongs to.
                  Deprecated: prefer IncidentRef.
                type: string
              requestedAt:
                description: RequestedAt is when this diagnostic run was requested.
                format: date-time
                type: string
            required:
            - requestedAt
            type: object
          status:
            description: DiagnosticRunStatus defines the observed state of DiagnosticRun.
            properties:
              collectedAt:
                description: CollectedAt is when evidence collection completed.
                format: date-time
                type: string
              collectionErrors:
                description: |-
                  CollectionErrors contains non-fatal errors that occurred during collection.
                  A DiagnosticRun may complete successfully even with collection errors (partial evidence).
                items:
                  type: string
                type: array
              collectorVersion:
                description: CollectorVersion is the version string of the diagnostics-worker
                  that ran this collection.
                type: string
              evidenceRef:
                description: EvidenceRef is the SQLite evidence.id for the collected
                  evidence payload.
                type: string
              logTruncationInfo:
                description: LogTruncationInfo contains information about log truncation.
                properties:
                  originalBytes:
                    description: OriginalBytes is the total byte size of all logs
                      before truncation.
                    format: int64
                    type: integer
                  truncated:
                    description: Truncated indicates whether any logs were truncated
                      due to size limits.
                    type: boolean
                  truncatedBytes:
                    description: TruncatedBytes is the total byte size of all logs
                      after truncation.
                    format: int64
                    type: integer
                required:
                - originalBytes
                - truncated
                - truncatedBytes
                type: object
              redactionSummary:
                description: RedactionSummary contains a summary of the redaction
                  process applied to the evidence.
                properties:
                  patternsApplied:
                    description: PatternsApplied is the number of redaction pattern
                      matches found and replaced.
                    type: integer
                  redactedFields:
                    description: RedactedFields is the list of JSON field paths that
                      contained sensitive data.
                    items:
                      type: string
                    type: array
                required:
                - patternsApplied
                type: object
              state:
                default: pending
                description: State is the current lifecycle state of this diagnostic
                  run.
                enum:
                - pending
                - running
                - completed
                - failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
