---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: incidents.kubechan.io
spec:
  group: kubechan.io
  names:
    kind: Incident
    listKind: IncidentList
    plural: incidents
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .spec.rootResource.name
      name: Root
      type: string
    - jsonPath: .status.activeProblemCases
      name: Active
      type: integer
    - jsonPath: .status.openedAt
      name: Opened
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Incident is the Schema for the incidents API.
          It groups related ProblemCases that share a common workload root.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IncidentSpec defines the desired state of Incident.
            properties:
              falsePositive:
                description: |-
                  FalsePositive marks this incident as a false positive — the behaviour was intentional
                  and expected. Set by the user after reviewing an LLM analysis that suggested
                  suggestFalsePositive. Once true, the incident will be auto-resolved.
                  Only meaningful for manual incidents (source=manual). Auto incidents use ExclusionRules.
                type: boolean
              problemCases:
                description: |-
                  ProblemCases is the list of ProblemCase names (in the same namespace) grouped
                  into this incident.
                items:
                  type: string
                type: array
              relatedResources:
                description: |-
                  RelatedResources is a list of additional Kubernetes resources the user tagged as relevant.
                  Cross-namespace is allowed. Only populated for manual incidents.
                items:
                  description: ResourceRef identifies a Kubernetes resource by namespace,
                    kind, and name.
                  properties:
                    apiGroup:
                      description: |-
                        APIGroup is the Kubernetes API group for this resource kind, e.g. "apps" or "keda.sh".
                        Empty means the core API group. Used by the dynamic client in diagnostics-worker
                        to resolve arbitrary CRDs requested by the user or suggested by the LLM.
                      type: string
                    evidenceSlices:
                      description: |-
                        EvidenceSlices controls which parts of this resource the diagnostics-worker collects
                        when it appears in RelatedResources. Empty means collect all slices applicable to the
                        kind (backward-compatible default).

                        Valid values:
                          spec        — resource spec field (with redaction)
                          status      — full status object
                          conditions  — status.conditions array, extracted separately for clarity
                          events      — Kubernetes Events for this resource
                          logs        — container logs (Deployment, StatefulSet, DaemonSet, Pod, Job only)
                          metrics     — current CPU/memory from metrics-server (container-having kinds only)
                          labels      — metadata.labels
                          annotations — metadata.annotations (sensitive values redacted)
                          ownerRefs   — metadata.ownerReferences chain resolved recursively up to the root
                      items:
                        type: string
                      type: array
                    kind:
                      description: Kind is the Kubernetes resource kind (e.g., Pod,
                        Deployment, ScaledObject).
                      type: string
                    name:
                      description: Name is the resource name.
                      type: string
                    namespace:
                      description: Namespace of the resource. Empty for cluster-scoped
                        resources.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              rootResource:
                description: |-
                  RootResource is the workload root (Deployment, StatefulSet, DaemonSet, etc.)
                  that all member ProblemCases trace back to via owner references.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the Kubernetes API group for this resource kind, e.g. "apps" or "keda.sh".
                      Empty means the core API group. Used by the dynamic client in diagnostics-worker
                      to resolve arbitrary CRDs requested by the user or suggested by the LLM.
                    type: string
                  evidenceSlices:
                    description: |-
                      EvidenceSlices controls which parts of this resource the diagnostics-worker collects
                      when it appears in RelatedResources. Empty means collect all slices applicable to the
                      kind (backward-compatible default).

                      Valid values:
                        spec        — resource spec field (with redaction)
                        status      — full status object
                        conditions  — status.conditions array, extracted separately for clarity
                        events      — Kubernetes Events for this resource
                        logs        — container logs (Deployment, StatefulSet, DaemonSet, Pod, Job only)
                        metrics     — current CPU/memory from metrics-server (container-having kinds only)
                        labels      — metadata.labels
                        annotations — metadata.annotations (sensitive values redacted)
                        ownerRefs   — metadata.ownerReferences chain resolved recursively up to the root
                    items:
                      type: string
                    type: array
                  kind:
                    description: Kind is the Kubernetes resource kind (e.g., Pod,
                      Deployment, ScaledObject).
                    type: string
                  name:
                    description: Name is the resource name.
                    type: string
                  namespace:
                    description: Namespace of the resource. Empty for cluster-scoped
                      resources.
                    type: string
                required:
                - kind
                - name
                type: object
              source:
                default: auto
                description: Source indicates who created this incident.
                enum:
                - auto
                - manual
                type: string
              userMessage:
                description: UserMessage is the plain-text description provided by
                  the user for manual incidents.
                type: string
            required:
            - rootResource
            type: object
          status:
            description: IncidentStatus defines the observed state of Incident.
            properties:
              activeProblemCases:
                description: ActiveProblemCases is the count of non-resolved ProblemCases
                  in this incident.
                type: integer
              openedAt:
                description: OpenedAt is when this incident was first opened.
                format: date-time
                type: string
              resolvedAt:
                description: ResolvedAt is when all member ProblemCases were resolved.
                format: date-time
                type: string
              state:
                default: open
                description: State is the current lifecycle state of this incident.
                enum:
                - open
                - resolved
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
