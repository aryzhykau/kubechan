---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kubechanexclusionrules.kubechan.io
spec:
  group: kubechan.io
  names:
    kind: KubechanExclusionRule
    listKind: KubechanExclusionRuleList
    plural: kubechanexclusionrules
    singular: kubechanexclusionrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .status.suppressedCount
      name: Suppressed
      type: integer
    - jsonPath: .status.lastMatchedAt
      name: Last Matched
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KubechanExclusionRule suppresses false-positive incident creation
          for a specific resource or selector during optional time windows.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
            type: string
          metadata:
            type: object
          spec:
            description: ExclusionRuleSpec defines the rule's matching criteria.
            properties:
              description:
                description: Human-readable reason for this exclusion.
                type: string
              detectors:
                description: Detector names this rule applies to. Empty means all detectors.
                items:
                  type: string
                type: array
              enabled:
                default: true
                description: Whether the rule is active.
                type: boolean
              namespace:
                description: Namespace scope for this rule. Applies to all resources
                  matched by TargetResources or Selector in this namespace.
                type: string
              selector:
                description: Label-selector based matching (OR with TargetResources).
                properties:
                  kinds:
                    description: Resource kinds to match. Empty means any kind.
                    items:
                      type: string
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: Label key/value pairs the target resource must have.
                    type: object
                  namespace:
                    description: Namespace to scope selector matching.
                    type: string
                type: object
              targetResources:
                description: Exact resources to suppress.
                items:
                  description: ResourceRef references a specific Kubernetes resource.
                  properties:
                    apiGroup:
                      description: APIGroup of the resource, e.g. "apps" or "keda.sh".
                        Empty means core group.
                      type: string
                    evidenceSlices:
                      description: Optional override for which evidence slices to collect.
                      items:
                        type: string
                      type: array
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
              timeWindow:
                description: Optional time window during which this rule is active.
                  Outside the window the rule does not suppress.
                properties:
                  periods:
                    description: One or more recurring time periods.
                    items:
                      description: ExclusionPeriod is a recurring daily time range.
                      properties:
                        days:
                          description: Days of the week. Mon,Tue,Wed,Thu,Fri,Sat,Sun.
                          items:
                            type: string
                          type: array
                        end:
                          description: End time "HH:MM" 24h. If End < Start the period
                            spans midnight.
                          type: string
                        start:
                          description: Start time "HH:MM" 24h.
                          type: string
                      required:
                      - days
                      - end
                      - start
                      type: object
                    type: array
                  timezone:
                    description: IANA timezone name, e.g. "Europe/Berlin". Defaults
                      to UTC.
                    type: string
                required:
                - periods
                - timezone
                type: object
            required:
            - enabled
            type: object
          status:
            description: ExclusionRuleStatus reflects observed rule activity.
            properties:
              lastMatchedAt:
                description: Last time this rule suppressed an incident.
                format: date-time
                type: string
              suppressedCount:
                description: Total number of times this rule has suppressed an incident.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
