---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kubechanexclusionrules.kubechan.io
spec:
  group: kubechan.io
  names:
    kind: KubechanExclusionRule
    listKind: KubechanExclusionRuleList
    plural: kubechanexclusionrules
    singular: kubechanexclusionrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .status.suppressedCount
      name: Suppressed
      type: integer
    - jsonPath: .spec.description
      name: Description
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubechanExclusionRule suppresses specific KubeChan detectors for matched resources,
          optionally within a recurring time window.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExclusionRuleSpec defines the desired state of KubechanExclusionRule.
            properties:
              description:
                description: Description is a human-readable explanation of why this
                  rule exists.
                type: string
              detectors:
                description: |-
                  Detectors lists the detector names to suppress.
                  Empty slice means suppress ALL detectors for matched resources.
                items:
                  type: string
                type: array
              enabled:
                default: true
                description: |-
                  Enabled controls whether this rule is actively enforced.
                  Defaults to true.
                type: boolean
              namespace:
                description: |-
                  Namespace optionally scopes the entire rule to a single namespace.
                  When set, the rule only fires if the affected resource lives in this namespace.
                  Acts as a fast pre-filter before TargetResources / Selector are evaluated.
                type: string
              selector:
                description: |-
                  Selector matches resources by label selector, optionally filtered by namespace and kinds.
                  Can be used together with TargetResources — a resource matching EITHER is suppressed.
                properties:
                  kinds:
                    description: |-
                      Kinds restricts matching to specific resource kinds (e.g. ["Deployment", "Service"]).
                      Empty means any kind.
                    items:
                      type: string
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels requires all listed key=value label pairs
                      to be present on the resource.
                    type: object
                  namespace:
                    description: |-
                      Namespace further narrows the selector to a specific namespace.
                      If ExclusionRuleSpec.Namespace is also set, both must agree.
                    type: string
                type: object
              targetResources:
                description: |-
                  TargetResources is a list of exact resource references to match.
                  Can be used together with Selector — a resource matching EITHER is suppressed.
                items:
                  description: ResourceRef identifies a Kubernetes resource by namespace,
                    kind, and name.
                  properties:
                    apiGroup:
                      description: |-
                        APIGroup is the Kubernetes API group for this resource kind, e.g. "apps" or "keda.sh".
                        Empty means the core API group. Used by the dynamic client in diagnostics-worker
                        to resolve arbitrary CRDs requested by the user or suggested by the LLM.
                      type: string
                    evidenceSlices:
                      description: |-
                        EvidenceSlices controls which parts of this resource the diagnostics-worker collects
                        when it appears in RelatedResources. Empty means collect all slices applicable to the
                        kind (backward-compatible default).

                        Valid values:
                          spec        — resource spec field (with redaction)
                          status      — full status object
                          conditions  — status.conditions array, extracted separately for clarity
                          events      — Kubernetes Events for this resource
                          logs        — container logs (Deployment, StatefulSet, DaemonSet, Pod, Job only)
                          metrics     — current CPU/memory from metrics-server (container-having kinds only)
                          labels      — metadata.labels
                          annotations — metadata.annotations (sensitive values redacted)
                          ownerRefs   — metadata.ownerReferences chain resolved recursively up to the root
                      items:
                        type: string
                      type: array
                    kind:
                      description: Kind is the Kubernetes resource kind (e.g., Pod,
                        Deployment, ScaledObject).
                      type: string
                    name:
                      description: Name is the resource name.
                      type: string
                    namespace:
                      description: Namespace of the resource. Empty for cluster-scoped
                        resources.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              timeWindow:
                description: |-
                  TimeWindow restricts the rule to specific recurring time periods.
                  Absent means the rule applies 24/7.
                properties:
                  periods:
                    description: Periods is the list of recurring time intervals during
                      which the rule fires.
                    items:
                      description: ExclusionPeriod is a single recurring time slot
                        within a week.
                      properties:
                        days:
                          description: |-
                            Days lists the days of week this period applies to.
                            Valid values: Mon, Tue, Wed, Thu, Fri, Sat, Sun.
                          items:
                            type: string
                          type: array
                        end:
                          description: |-
                            End is the period end time in "HH:MM" 24-hour format.
                            End < Start is valid and means the period spans midnight.
                          type: string
                        start:
                          description: Start is the period start time in "HH:MM" 24-hour
                            format.
                          type: string
                      required:
                      - days
                      - end
                      - start
                      type: object
                    type: array
                  timezone:
                    default: UTC
                    description: Timezone is an IANA timezone name, e.g. "Europe/Berlin".
                      Defaults to UTC.
                    type: string
                required:
                - periods
                - timezone
                type: object
            required:
            - enabled
            type: object
          status:
            description: ExclusionRuleStatus defines the observed state of KubechanExclusionRule.
            properties:
              lastMatchedAt:
                description: LastMatchedAt records when this rule last suppressed
                  a ProblemCase creation.
                format: date-time
                type: string
              suppressedCount:
                description: SuppressedCount is the lifetime count of ProblemCase
                  creations suppressed by this rule.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
