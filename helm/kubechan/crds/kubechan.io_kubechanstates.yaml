---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kubechanstates.kubechan.io
spec:
  group: kubechan.io
  names:
    kind: KubeChanState
    listKind: KubeChanStateList
    plural: kubechanstates
    singular: kubechanstate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.moodLevel
      name: Mood
      type: integer
    - jsonPath: .status.openIncidentCount
      name: Open Incidents
      type: integer
    - jsonPath: .status.pokeCount
      name: Pokes
      type: integer
    - jsonPath: .status.updatedAt
      name: Updated
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubeChanState is a singleton CRD that persists KubeChan's current mood.
          There is exactly one instance per control namespace, named "kubechan".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KubeChanStateSpec is intentionally empty — KubeChanState is a singleton
              whose only meaningful content is its observed status (mood).
            type: object
          status:
            description: KubeChanStateStatus reflects KubeChan's current mood and
              the signals that drive it.
            properties:
              moodLevel:
                default: 0
                description: 'MoodLevel is the computed mood: 0=calm, 1=irritated,
                  2=rage.'
                format: int32
                type: integer
              openIncidentCount:
                description: OpenIncidentCount is the number of currently open incidents.
                type: integer
              pokeCount:
                description: PokeCount is the number of pokes accumulated in the current
                  streak.
                type: integer
              pokeExpiresAt:
                description: PokeExpiresAt is when the current poke streak expires
                  and resets.
                format: date-time
                type: string
              updatedAt:
                description: UpdatedAt is when the mood was last recomputed.
                format: date-time
                type: string
            required:
            - moodLevel
            - openIncidentCount
            - pokeCount
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
