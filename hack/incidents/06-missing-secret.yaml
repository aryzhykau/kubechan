# Level 6: a required Secret reference prevents Pod startup.
apiVersion: v1
kind: Namespace
metadata:
  name: kubechan-incident-06
  labels: {kubechan.io/test-incident: "06"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: kubechan-incident-06
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["echo INFO orders-api ready; sleep 3600"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: orders-db, key: url}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: kubechan-incident-06
spec:
  selector: {app: orders}
  ports: [{name: http, port: 8080, targetPort: 8080}]
