# Level 8: a running process never opens its port; probes fail and the Service has no ready endpoints.
apiVersion: v1
kind: Namespace
metadata:
  name: kubechan-incident-08
  labels: {kubechan.io/test-incident: "08"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessions
  namespace: kubechan-incident-08
spec:
  replicas: 1
  selector: {matchLabels: {app: sessions}}
  template:
    metadata: {labels: {app: sessions}}
    spec:
      containers:
        - name: sessions
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo 'ERROR redis:6379 connection refused; HTTP listener not started'
              sleep 3600
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sessions
  namespace: kubechan-incident-08
spec:
  selector: {app: sessions}
  ports: [{name: http, port: 80, targetPort: http}]
