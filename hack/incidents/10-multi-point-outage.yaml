# Level 10: stale Ingress backend + wrong Service selector + missing config/secret + Pending PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: kubechan-incident-10
  labels: {kubechan.io/test-incident: "10"}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uploads, namespace: kubechan-incident-10}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kubechan-nonexistent-storage-class
  resources: {requests: {storage: 50Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: kubechan-incident-10}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway, track: stable}}
    spec:
      volumes:
        - name: config
          configMap: {name: gateway-config}
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["echo 'FATAL configuration and credentials unavailable'; exit 1"]
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: gateway-secrets, key: jwt-key}
          volumeMounts:
            - {name: config, mountPath: /etc/gateway}
            - {name: uploads, mountPath: /var/uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-public
  namespace: kubechan-incident-10
  annotations: {kubechan.io/renamed-from: gateway}
spec:
  selector: {app: gateway, track: canary}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: gateway, namespace: kubechan-incident-10}
spec:
  ingressClassName: nginx
  rules:
    - host: incident-10.kubechan.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gateway-public, port: {number: 80}}
