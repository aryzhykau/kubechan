name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go: lint ───────────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Verify controller-gen output is up-to-date
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./api/..."
          controller-gen crd paths="./api/..." output:crd:artifacts:config=helm/kubechan/crds/
          git diff --exit-code || \
            (echo "Generated files are out of date. Run 'make generate' and commit the result." && exit 1)

  # ── Go: build + test ───────────────────────────────────────────────────────
  build-test-go:
    name: Build & Test Go
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go mod tidy
        run: go mod tidy && git diff --exit-code

      - name: Build cluster-watcher
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./services/cluster-watcher/

      - name: Build diagnostics-worker
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./services/diagnostics-worker/

      - name: Build backend-api
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./services/backend-api/

      - name: Test Go with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Go coverage gate + PR comment
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          local-prefix: github.com/org/kubechan
          config: .github/go-coverage.yml
          git-token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || '' }}
          git-branch: main

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  # ── Python: lint + test ────────────────────────────────────────────────────
  lint-test-python:
    name: Lint & Test Python
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: services/llm-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: services/llm-gateway/uv.lock

      - name: Install dependencies
        run: unset VIRTUAL_ENV; uv sync --frozen --group dev

      - name: Pyright
        run: unset VIRTUAL_ENV; uv run pyright .

      - name: Pytest + coverage
        run: unset VIRTUAL_ENV; uv run pytest -v
        # pyproject.toml addopts already include:
        #   --cov=app --cov=main --cov-report=term-missing
        #   --cov-report=xml:coverage.xml --cov-fail-under=70
        # The step will exit non-zero when coverage < 70 %, blocking the PR.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/llm-gateway/coverage.xml
          retention-days: 14

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: services/llm-gateway/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.70
          thresholdNew: 0.70
          thresholdModified: 0.70

  # ── Frontend: build ────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/frontend-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Helm: lint ─────────────────────────────────────────────────────────────
  lint-helm:
    name: Lint Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/kubechan --values helm/kubechan/values-dev.yaml
