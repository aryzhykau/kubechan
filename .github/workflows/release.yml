name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  OWNER: aryzhykau

jobs:
  build-architecture-images:
    name: Build ${{ matrix.service }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - cluster-watcher
          - diagnostics-worker
          - backend-api
          - llm-gateway
          - frontend-ui
        architecture:
          - amd64
          - arm64
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - service: cluster-watcher
            context: .
            dockerfile: services/cluster-watcher/Dockerfile
          - service: diagnostics-worker
            context: .
            dockerfile: services/diagnostics-worker/Dockerfile
          - service: backend-api
            context: .
            dockerfile: services/backend-api/Dockerfile
          - service: llm-gateway
            context: services/llm-gateway
            dockerfile: services/llm-gateway/Dockerfile
          - service: frontend-ui
            context: services/frontend-ui
            dockerfile: services/frontend-ui/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/kubechan-${{ matrix.service }}:${{ steps.version.outputs.version }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.architecture }}

  merge-images:
    name: Merge ${{ matrix.service }} manifest
    runs-on: ubuntu-24.04
    needs: build-architecture-images
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - cluster-watcher
          - diagnostics-worker
          - backend-api
          - llm-gateway
          - frontend-ui

    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/kubechan-${{ matrix.service }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Verify manifest architectures
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/kubechan-${{ matrix.service }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

  publish-chart:
    name: Publish Helm Chart (OCI)
    runs-on: ubuntu-latest
    needs: merge-images
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/kubechan/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/kubechan/Chart.yaml

      - name: Package chart
        run: helm package helm/kubechan --destination /tmp/chart-output

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR OCI
        run: helm push /tmp/chart-output/kubechan-${{ steps.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}
