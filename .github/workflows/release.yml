name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  OWNER: aryzhykau

jobs:
  build-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: cluster-watcher
            context: .
            dockerfile: services/cluster-watcher/Dockerfile
          - service: diagnostics-worker
            context: .
            dockerfile: services/diagnostics-worker/Dockerfile
          - service: backend-api
            context: .
            dockerfile: services/backend-api/Dockerfile
          - service: llm-gateway
            context: services/llm-gateway
            dockerfile: services/llm-gateway/Dockerfile
          - service: frontend-ui
            context: services/frontend-ui
            dockerfile: services/frontend-ui/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kubechan-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kubechan-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    name: Publish Helm Chart (OCI)
    runs-on: ubuntu-latest
    needs: build-push-images
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/kubechan/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/kubechan/Chart.yaml

      - name: Package chart
        run: helm package helm/kubechan --destination /tmp/chart-output

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR OCI
        run: helm push /tmp/chart-output/kubechan-${{ steps.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}
