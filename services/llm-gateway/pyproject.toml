[project]
name = "llm-gateway"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "boto3>=1.38.0",
    "github-copilot-sdk>=0.3.0",
    "litellm==1.106.6",
    "pydantic>=2.12.0,<3",
    "structlog==25.1.0",
    "tiktoken==0.14.0",
    "jinja2>=3.1.6,<4",
    "httpx==0.28.1",
    "pydantic-ai-slim[bedrock]>=1.0,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov=main --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
